<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>gamba</title>
</head>
<body>

<div class="container">
  <div class="spinner-wrapper" id="spinner-viewport">
    <div class="reel-track" id="reel-track"></div>
  </div>

  <div class="result-banner" id="result-banner">choose your dipshit</div>

  <div class="controls">
    <label for="player-select">Players:</label>
    <select id="player-select" onchange="updatePlayerCount(this.value)">
      <option value="1">solo</option>
      <option value="2">duo</option>
      <option value="3">trio</option>
      <option value="4" selected>quad</option>
      <option value="5">five stack</option>
      <option value="6">six stack</option>
    </select>
    <button id="roll-all-btn" onclick="rollAll()">roll all</button>
  </div>

  <table id="players-table">
    <thead>
      <tr>
        <th>player</th>
        <th>tank</th>
        <th>damage</th>
        <th>support</th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>

  <footer>
    <small id="fl">created by kenzie webmedia, maintained by azalea heartfelt</small>
    <br>
    <small><small id="fl">v1.4.0 (2026/11/14)</small></small>
    <small id="fr">made with ❤️sleep deprivation💚</small>
  </footer>
</div>
<script src="script.js"></script>
</body>
</html>
